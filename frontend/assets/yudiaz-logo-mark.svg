<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="c2b-bg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#0e1017"/>
      <stop offset="60%" stop-color="#08090c"/>
      <stop offset="100%" stop-color="#030406"/>
    </radialGradient>
    <filter id="c2b-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <rect width="500" height="500" rx="44" fill="url(#c2b-bg)"/>

  <!-- Construction guide lines -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <circle cx="250" cy="250" r="185" fill="none"/>
    <circle cx="250" cy="250" r="120" fill="none"/>
    <line x1="250" y1="35" x2="250" y2="465"/>
    <line x1="35" y1="250" x2="465" y2="250"/>
  </g>

  <!-- ==================== CONCEPT 2B: THE NEGATIVE SPACE PORTAL ==================== -->
  <g filter="url(#c2b-shadow)">
    <!-- LEFT MONOLITH (Spine of 'D') -->
    <path d="M 118 100
             L 182 100
             L 236 218
             Q 238 222 238 228
             L 238 400
             L 118 400
             Z"
          fill="#ffffff"/>

    <!-- RIGHT MONOLITH (Arch / Bowl of 'D') -->
    <path d="M 264 400
             L 264 228
             Q 264 222 266 218
             L 318 100
             C 370 100, 412 158, 412 250
             C 412 342, 370 400, 264 400
             Z"
          fill="#ffffff"/>
  </g>

  <!-- Technical Spec Caption -->
  <text x="250" y="460" text-anchor="middle" fill="#64748b" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="9.5" letter-spacing="3" opacity="0.8">NEGATIVE SPACE PORTAL // ARCHETYPE 2B</text>
</svg>